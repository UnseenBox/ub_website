<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Fogline — Bunker Defense</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #050505;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas { display: block; outline: none; touch-action: none; }

      #touch-hint, #rotate-hint {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        font-family: Consolas, "Courier New", monospace;
      }
      #touch-hint {
        display: none;
        inset: 0;
        opacity: 0.9;
        transition: opacity 0.4s ease;
      }
      #touch-hint span {
        position: absolute;
        bottom: calc(22% + env(safe-area-inset-bottom, 0px));
        padding: 0.4em 0.8em;
        border: 1px solid rgba(220, 220, 198, 0.28);
        border-radius: 999px;
        color: rgba(220, 220, 198, 0.55);
        font-size: clamp(12px, 2.4vw, 20px);
        letter-spacing: 0.2em;
      }
      #touch-hint .aim { left: 10%; }
      #touch-hint .fire { right: 10%; }
      body.touched #touch-hint { opacity: 0; }

      #rotate-hint {
        display: none;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #050505;
        color: #d8d4bc;
        font-size: clamp(16px, 4vw, 28px);
        letter-spacing: 0.12em;
        text-align: center;
      }

      @media (pointer: coarse) {
        #touch-hint { display: block; }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="touch-hint" aria-hidden="true"><span class="aim">AIM</span><span class="fire">FIRE</span></div>
    <div id="rotate-hint" aria-hidden="true">ROTATE TO LANDSCAPE</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
