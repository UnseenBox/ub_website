<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
    <title>Fogline — Bunker Defense</title>
    <style>
      /* The game's two faces, bundled so they draw the same on every device. */
      @font-face { font-family: "Saira Stencil One"; src: url("./fonts/SairaStencilOne-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "Saira"; src: url("./fonts/Saira-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
      @font-face { font-family: "Saira"; src: url("./fonts/Saira-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #050505;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
      }
      body {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
      }
      #game canvas { display: block; outline: none; touch-action: none; }

      #rotate-hint {
        position: fixed;
        z-index: 10;
        pointer-events: none;
        font-family: "Saira", sans-serif;
      }
      #rotate-hint {
        display: none;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #050505;
        color: #d8d4bc;
        font-size: clamp(16px, 4vw, 28px);
        letter-spacing: 0.12em;
        text-align: center;
      }

      #boot-hint {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: #e0e6c0;
        font-family: "Saira Stencil One", sans-serif;
        font-size: clamp(28px, 7vw, 72px);
        letter-spacing: 0.06em;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Shown until the game draws its first frame, so the page is never just black. -->
    <div id="boot-hint">FOG LINE</div>
    <div id="rotate-hint" aria-hidden="true">ROTATE TO LANDSCAPE</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
