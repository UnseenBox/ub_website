<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Keep the splash in the player's language even before the bundle runs.
      try {
        document.documentElement.lang = localStorage.getItem('crazy-goal-lang') === 'ar' ? 'ar' : 'en';
      } catch {
        /* private mode: default English */
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Crazy Kora: street football trick shots in the alleys of the houma. Drag back, let go, and score the craziest goal you can." />
    <title>Crazy Kora</title>
    <style>
      /* The splash is fully self-contained so it paints before any bundle arrives. */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 15%, rgba(31, 194, 76, 0.08), transparent 30%),
          radial-gradient(circle at 85% 80%, rgba(255, 200, 58, 0.12), transparent 35%),
          #ffffff;
        background-color: #ffffff;
        transition: opacity 0.4s ease-out, visibility 0.4s;
      }

      #app-loading.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-stack {
        display: grid;
        justify-items: center;
        gap: clamp(6px, 2vmin, 18px);
        width: min(520px, 92vw);
        text-align: center;
      }

      .loading-art {
        width: min(72vw, 340px);
        filter: drop-shadow(0 14px 18px rgba(11, 77, 28, 0.16));
        animation: art-in 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }

      @keyframes art-in {
        from {
          opacity: 0;
          transform: translateY(26px) scale(0.88);
        }
      }

      .loading-logo {
        width: min(52vw, 230px);
        margin-top: -6px;
        filter: drop-shadow(0 6px 8px rgba(11, 77, 28, 0.18));
        animation: logo-in 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) 0.08s both;
      }

      @keyframes logo-in {
        from {
          opacity: 0;
          transform: rotate(-7deg) scale(1.4);
        }
      }

      /* A ball that keeps the goalkeeper warm while the street loads. */
      .loading-ball {
        width: clamp(54px, 9vmin, 74px);
        animation: ball-bounce 1.05s cubic-bezier(0.45, 0, 0.35, 1.6) infinite;
        will-change: transform;
      }

      @keyframes ball-bounce {
        0%, 100% { transform: translateY(6px) scale(1.18, 0.78); }
        28% { transform: translateY(-4px) scale(0.95, 1.08); }
        50% { transform: translateY(-64px) scale(0.93, 1.09); }
        70% { transform: translateY(-8px) scale(1.02, 0.97); }
        82% { transform: translateY(3px) scale(1.12, 0.85); }
        92% { transform: translateY(8px) scale(1.16, 0.8); }
      }

      .loading-shadow {
        width: clamp(46px, 8vmin, 66px);
        height: clamp(10px, 1.8vmin, 15px);
        border-radius: 50%;
        background: #0b4d1f;
        animation: shadow-bounce 1.05s cubic-bezier(0.45, 0, 0.35, 1.6) infinite;
      }

      @keyframes shadow-bounce {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(0.48); opacity: 0.14; }
        82% { transform: scale(0.86); opacity: 0.26; }
      }

      .loading-stars {
        display: flex;
        gap: clamp(10px, 3vmin, 26px);
        margin-top: 2px;
      }

      .loading-star {
        width: clamp(26px, 5vmin, 40px);
        animation: star-twinkle 1.35s ease-in-out infinite;
      }

      .loading-star:nth-child(2) { width: clamp(34px, 6.4vmin, 52px); }
      .loading-star:nth-child(1) { animation-delay: 0s; }
      .loading-star:nth-child(2) { animation-delay: 0.22s; }
      .loading-star:nth-child(3) { animation-delay: 0.44s; }

      @keyframes star-twinkle {
        0%, 100% { opacity: 0.35; transform: scale(0.8) rotate(-14deg); }
        35% { opacity: 1; transform: scale(1.18) rotate(10deg); }
        60% { opacity: 0.85; transform: scale(1) rotate(0deg); }
      }

      .loading-caption {
        font-family: 'Unbounded', 'Arial Black', system-ui, sans-serif;
        font-size: clamp(11px, 2.1vmin, 14px);
        font-weight: 900;
        letter-spacing: 0.26em;
        color: #0b4d1f;
        margin: 2px 0 0;
      }

      .loading-caption::after {
        content: '…';
        animation: dots 1.2s steps(4, end) infinite;
      }

      @keyframes dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }

      .loading-bar {
        width: min(300px, 64vw);
        height: 14px;
        border-radius: 999px;
        background: #e7ece0;
        box-shadow: inset 2px 2px 0 rgba(11, 77, 28, 0.18);
        overflow: hidden;
      }

      .loading-fill {
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffd94d, #f2b52a);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.6);
        animation: shimmer 1.15s ease-in-out infinite alternate;
      }

      @keyframes shimmer {
        from { transform: translateX(-28%); }
        to { transform: translateX(150%); }
      }

      .loading-tip {
        font-family: 'Unbounded', 'Arial Black', system-ui, sans-serif;
        font-size: clamp(8px, 1.5vmin, 10px);
        font-weight: 700;
        letter-spacing: 0.14em;
        color: rgba(11, 77, 28, 0.62);
        margin: 2px 0 0;
      }

      /* One line per language, chosen by the inline script above. */
      .loading-tip-ar { display: none; }
      :lang(ar) .loading-tip-en { display: none; }
      :lang(ar) .loading-tip-ar { display: block; }

      @media (prefers-reduced-motion: reduce) {
        .loading-ball, .loading-shadow, .loading-star, .loading-art, .loading-logo {
          animation: none;
        }
        .loading-fill { animation: none; transform: none; width: 60%; }
      }
    </style>
  </head>
  <body>
    <div id="app-loading" aria-hidden="true">
      <div class="loading-stack">
        <img class="loading-logo" src="./src/assets/ui/logo.png" alt="" draggable="false" />
        <div class="loading-ball" aria-hidden="true">
          <svg viewBox="0 0 100 100" role="img" focusable="false">
            <circle cx="50" cy="50" r="44" fill="#ffffff" stroke="#1b2540" stroke-width="8" />
            <path d="M50 26 L70.4 40.9 L62.6 64.6 L37.4 64.6 L29.6 40.9 Z" fill="#1b2540" />
          </svg>
        </div>
        <div class="loading-shadow" aria-hidden="true"></div>
        <div class="loading-stars" aria-hidden="true">
          <img class="loading-star" src="./src/assets/ui/arcade-star.png" alt="" draggable="false" />
          <img class="loading-star" src="./src/assets/ui/arcade-star.png" alt="" draggable="false" />
          <img class="loading-star" src="./src/assets/ui/arcade-star.png" alt="" draggable="false" />
        </div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
        <p class="loading-caption" dir="ltr">CRAZY KORA</p>
        <p class="loading-tip loading-tip-en">WARMING UP THE STREET</p>
        <p class="loading-tip loading-tip-ar">جارٍ تسخين الشارع</p>
      </div>
    </div>
    <div id="app">
      <canvas id="game" aria-label="Crazy Kora play field"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
