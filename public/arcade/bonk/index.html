<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1b1730" />
    <meta name="description" content="Living cardboard boxes are moving you out at 3 a.m. You have no weapon. Good. Bonk them with the toaster. A physics sandbox brawler where everything in the flat is a weapon." />
    <title>BONK!</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1730'/%3E%3Cpath d='M9 8h4v8h8v4h2v6h-3v-5h-8v5H9z' fill='%23ffd23f'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-Dvss_cYh.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BDYnapyr.css">
    <link rel="stylesheet" href="./assets/bonk-cartoon-ui.css">
    <link rel="stylesheet" href="./assets/bonk-overlay-ui.css">
    <style>
      /* Custom torn-paper hand cursor, drawn to match BONK! */
      #game { cursor: none; }

      #game-cursor {
        position: fixed;
        left: 0;
        top: 0;
        width: 64px;
        height: 64px;
        pointer-events: none;
        z-index: 99999;
        opacity: 0;
        visibility: hidden;
        will-change: transform;
        transition: opacity 0.14s ease-out, visibility 0.14s;
        contain: layout style;
      }
      #game-cursor.is-visible { opacity: 1; visibility: visible; }

      /* soft grab glow under the art */
      #game-cursor .glow {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 210, 63, 0.55) 0%, rgba(255, 210, 63, 0) 68%);
        opacity: 0;
        transform: scale(0.8);
        transition: opacity 0.18s ease-out;
      }
      #game-cursor.is-charging .glow { opacity: 1; animation: cursor-glow 0.55s ease-in-out infinite; }

      #game-cursor img {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 32px 30px; /* palm = hotspot */
        will-change: transform;
        transition: transform 0.1s ease-out;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      @keyframes cursor-glow {
        0%, 100% { transform: scale(0.85); opacity: 0.45; }
        50%      { transform: scale(1.2);  opacity: 0.95; }
      }

      /* touch devices keep the plain browser cursor */
      body.touch #game { cursor: default; }
      body.touch #game-cursor { display: none !important; }

      @media (prefers-reduced-motion: reduce) {
        #game-cursor .glow { animation: none !important; }
        #game-cursor img { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Game"></canvas>
      <div id="game-cursor" aria-hidden="true">
        <span class="glow"></span>
        <img id="game-cursor-img" src="./assets/cursor-hand.svg" alt="" draggable="false" />
      </div>
      <div id="hud"></div>
      <div id="screens"></div>
      <div id="menu-credits-bar" aria-hidden="false">
        <button id="menu-credits-btn" type="button">credits</button>
        <p id="menu-copy">© BONK! — UnseenBox</p>
      </div>
      <div id="menu-credits-panel" hidden>
        <div class="mcp-card" role="dialog" aria-modal="true" aria-label="Credits">
          <h2>CREDITS</h2>
          <p>BONK! — everything is a weapon</p>
          <p>A physics sandbox brawler by UnseenBox</p>
          <p>Design, code &amp; art: the UnseenBox team</p>
          <button id="menu-credits-close" type="button" class="mcp-close">CLOSE</button>
        </div>
      </div>
      <div id="debug"></div>
      <div id="rotate" role="dialog" aria-label="Rotate your phone">
        <div class="rotate-phone"></div>
        <div class="rotate-title">ROTATE YOUR PHONE</div>
        <div class="rotate-sub">This room is wider than it is tall.</div>
        <button id="rotate-dismiss" type="button" class="btn">PLAY UPRIGHT ANYWAY</button>
      </div>
    </div>
    <script>
      (function () {
        // Only for precise pointers; touch devices keep their own cursor.
        if (window.matchMedia && !window.matchMedia('(pointer: fine)').matches) return;

        var cursor = document.getElementById('game-cursor');
        var img = document.getElementById('game-cursor-img');
        if (!cursor || !img) return;

        var SRC = {
          open: './assets/cursor-hand.svg',
          grab: './assets/cursor-hand-grab.svg',
          throw: './assets/cursor-hand-throw.svg'
        };

        // Hotspot inside the 64x64 art (palm). Kept in sync with CSS transform-origin.
        var HOT_X = 32, HOT_Y = 30;

        var tx = 0, ty = 0;        // mouse target
        var x = 0, y = 0;          // smoothed position
        var lastX = 0;
        var tilt = 0, tiltTarget = 0;
        var scale = 1, scaleTarget = 1;
        var holding = false, holdStart = 0;
        var state = 'open';
        var shown = false;
        var overUi = false;
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function setState(next) {
          if (state === next) return;
          state = next;
          img.src = SRC[next];
        }
        function show() {
          if (!inGame() || shown) return;
          shown = true;
          cursor.classList.add('is-visible');
        }
        function hide() {
          if (!shown) return;
          shown = false;
          cursor.classList.remove('is-visible');
        }
        function onUi(target) {
          return !!(target && target.closest &&
            target.closest('button, a, input, select, textarea, label, summary, .btn, .hud-pause, .mk-gear'));
        }
        // The hand belongs to gameplay: menus keep their native pointer so the
        // two cursors never show at once.
        function inGame() {
          return document.body.classList.contains('playing');
        }

        document.addEventListener('mousemove', function (e) {
          tx = e.clientX;
          ty = e.clientY;
          overUi = onUi(e.target);
          if (!shown) { x = tx; y = ty; }
          if (overUi || !inGame()) hide(); else show();
        }, { passive: true, capture: true });

        document.addEventListener('pointerdown', function (e) {
          if (onUi(e.target)) return;
          holding = true;
          holdStart = performance.now();
          setState('grab');
          scaleTarget = 0.9;
          cursor.classList.remove('is-charging');
          window.setTimeout(function () { if (holding) scaleTarget = 1; }, 120);
        }, true);

        document.addEventListener('pointerup', function () {
          if (!holding) return;
          holding = false;
          var held = (performance.now() - holdStart) / 1000;
          cursor.classList.remove('is-charging');
          setState('throw');
          scaleTarget = 1.12;
          window.setTimeout(function () {
            setState('open');
            scaleTarget = 1;
          }, held > 0.25 ? 260 : 175);
        }, true);

        document.addEventListener('mouseleave', hide);
        window.addEventListener('blur', hide);

        function frame(now) {
          var t = now / 1000;

          // eased follow
          var ease = reduce ? 1 : 0.34;
          x += (tx - x) * ease;
          y += (ty - y) * ease;

          // lean into horizontal movement
          var vx = tx - lastX;
          lastX = tx;
          var lean = Math.max(-12, Math.min(12, vx * 0.5));
          tiltTarget += (lean - tiltTarget) * 0.14;
          tilt = tiltTarget;

          // scale: spring back, idle breath, charge pulse
          scale += (scaleTarget - scale) * 0.28;
          var s = scale;
          if (!reduce) {
            if (holding) {
              var dt = (now - holdStart) / 1000;
              s *= 1 + Math.sin(dt * 13) * 0.035;
              if (dt > 0.16) cursor.classList.add('is-charging');
            } else {
              s *= 1 + Math.sin(t * 2.2) * 0.012;
            }
          }

          // drop the hand as soon as play stops (pause, menu, results)
          if (!inGame()) {
            if (holding) {
              holding = false;
              cursor.classList.remove('is-charging');
              setState('open');
              scaleTarget = 1;
            }
            if (shown) hide();
          }

          cursor.style.transform =
            'translate3d(' + (x - HOT_X) + 'px,' + (y - HOT_Y) + 'px,0)';
          img.style.transform =
            'rotate(' + tilt.toFixed(2) + 'deg) scale(' + s.toFixed(3) + ')';

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <script>
      (function () {
        var btn = document.getElementById('menu-credits-btn');
        var panel = document.getElementById('menu-credits-panel');
        var close = document.getElementById('menu-credits-close');
        if (!btn || !panel) return;

        function open() { panel.hidden = false; if (close) close.focus(); }
        function shut() { panel.hidden = true; btn.focus(); }

        btn.addEventListener('click', open);
        if (close) close.addEventListener('click', shut);
        panel.addEventListener('click', function (e) { if (e.target === panel) shut(); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !panel.hidden) shut();
        });
      })();
    </script>
    <script>
      (function () {
        var screens = document.getElementById('screens');
        if (!screens) return;

        function build() {
          var el = document.createElement('div');
          el.id = 'bonk-menu-scene';
          el.setAttribute('aria-hidden', 'true');
          el.innerHTML =
            '<img class="scene-bg" src="./assets/menu-scene.svg" alt="">';
          return el;
        }

        function sync() {
          var screen = screens.querySelector('.screen.menu-board');
          var scene = screens.querySelector('#bonk-menu-scene');
          if (!screen) {
            if (scene) scene.remove();
            return;
          }
          if (!scene) {
            screen.prepend(build());
          } else if (screen.firstElementChild !== scene) {
            screen.prepend(scene);
          }
        }

        new MutationObserver(sync).observe(screens, { childList: true });
        sync();

        /* ---- subtle parallax: the room leans with the pointer ---- */
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var px = 0, py = 0, tx = 0, ty = 0, running = false;

        function tick() {
          px += (tx - px) * 0.075;
          py += (ty - py) * 0.075;
          var bg = document.querySelector('#bonk-menu-scene .scene-bg');
          if (bg) {
            bg.style.transform =
              'scale(1.06) translate3d(' + (-px * 16).toFixed(2) + 'px,' + (-py * 12).toFixed(2) + 'px,0)';
          }
          if (Math.abs(tx - px) > 0.0015 || Math.abs(ty - py) > 0.0015) {
            requestAnimationFrame(tick);
          } else {
            running = false;
          }
        }

        if (!reduce) {
          document.addEventListener('mousemove', function (e) {
            if (!document.querySelector('#bonk-menu-scene')) return;
            tx = (e.clientX / window.innerWidth) - 0.5;
            ty = (e.clientY / window.innerHeight) - 0.5;
            if (!running) { running = true; requestAnimationFrame(tick); }
          }, { passive: true });
        }
      })();
    </script>
    <script>
      /* Candy UI: menu action row (MODE / SHOP / SETTINGS) and settings tabs. */
      (function () {
        var screens = document.getElementById('screens');
        if (!screens) return;

        var POWERS = [
          ['BIG RED BUTTON', 150],
          ['SUGAR RUSH', 120],
          ['DEEP FREEZE', 120]
        ];
        var wantShop = false;

        function gear() { return screens.querySelector('.screen.menu-board .mk-gear'); }

        function menuRow() {
          var row = document.createElement('div');
          row.className = 'candy-menu-row';
          row.innerHTML =
            '<button type="button" class="candy-btn candy-blue" data-candy="mode"><span class="candy-ico">\u2605</span>MODE</button>' +
            '<button type="button" class="candy-btn candy-orange" data-candy="shop"><span class="candy-ico">\u25C6</span>SHOP</button>' +
            '<button type="button" class="candy-btn candy-purple" data-candy="settings"><span class="candy-ico">\u2699</span>SETTINGS</button>';
          return row;
        }

        function shopPanel() {
          var shop = document.createElement('div');
          shop.className = 'candy-shop';
          shop.hidden = true;
          POWERS.forEach(function (p) {
            var card = document.createElement('div');
            card.className = 'candy-item';
            card.innerHTML =
              '<div class="candy-item-art"></div>' +
              '<div class="candy-item-name">' + p[0] + '</div>' +
              '<div class="candy-item-price">' + p[1] + '</div>' +
              '<div class="candy-item-note">buy during a run</div>';
            shop.appendChild(card);
          });
          return shop;
        }

        function tabBar() {
          var bar = document.createElement('div');
          bar.className = 'candy-tabs';
          bar.innerHTML =
            '<button type="button" class="candy-tab on" data-tab="settings">SETTINGS</button>' +
            '<button type="button" class="candy-tab" data-tab="shop">SHOP</button>';
          return bar;
        }

        function setTab(sheet, want) {
          var shop = sheet.querySelector('.candy-shop');
          var tabs = sheet.querySelectorAll('.candy-tab');
          sheet.classList.toggle('tab-shop', want === 'shop');
          if (shop) shop.hidden = want !== 'shop';
          for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === want);
          }
        }

        screens.addEventListener('click', function (e) {
          var btn = e.target && e.target.closest ? e.target.closest('.candy-btn[data-candy]') : null;
          if (!btn) return;
          var what = btn.getAttribute('data-candy');
          if (what === 'mode') {
            var map = screens.querySelector('.screen.menu-board .rm-mapbtn');
            if (map) map.click();
          } else if (what === 'shop') {
            wantShop = true;
            if (gear()) gear().click();
          } else {
            wantShop = false;
            if (gear()) gear().click();
          }
        });

        function syncMenu() {
          var action = screens.querySelector('.screen.menu-board .rm-action');
          if (action && !action.querySelector('.candy-menu-row')) action.appendChild(menuRow());
        }

        function syncSettings() {
          var sheet = screens.querySelector('.screen.settings .sheet');
          if (!sheet) return;
          if (!sheet.querySelector('.candy-tabs')) {
            var bar = tabBar();
            sheet.insertBefore(bar, sheet.firstChild);
            sheet.appendChild(shopPanel());
            bar.addEventListener('click', function (e) {
              var tab = e.target.closest ? e.target.closest('.candy-tab') : null;
              if (tab) setTab(sheet, tab.getAttribute('data-tab'));
            });
          }
          if (wantShop) {
            setTab(sheet, 'shop');
            wantShop = false;
          }
        }

        function sync() { syncMenu(); syncSettings(); }

        new MutationObserver(sync).observe(screens, { childList: true, subtree: true });
        sync();
      })();
    </script>
  </body>
</html>
