<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1b1730" />
    <meta name="description" content="Living cardboard boxes are moving you out at 3 a.m. You have no weapon. Good. Bonk them with the toaster. A physics sandbox brawler where everything in the flat is a weapon." />
    <title>BONK!</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1730'/%3E%3Cpath d='M9 8h4v8h8v4h2v6h-3v-5h-8v5H9z' fill='%23ffd23f'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-DAKlC1oT.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-arPfi0qf.css">
    <link rel="stylesheet" href="./assets/bonk-comic-ui.css">
    <style>
      /* Custom torn-paper hand cursor, drawn to match BONK! */
      #game { cursor: none; }

      #game-cursor {
        position: fixed;
        left: 0;
        top: 0;
        width: 64px;
        height: 64px;
        pointer-events: none;
        z-index: 99999;
        opacity: 0;
        visibility: hidden;
        will-change: transform;
        transition: opacity 0.14s ease-out, visibility 0.14s;
        contain: layout style;
      }
      #game-cursor.is-visible { opacity: 1; visibility: visible; }

      /* soft grab glow under the art */
      #game-cursor .glow {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 210, 63, 0.55) 0%, rgba(255, 210, 63, 0) 68%);
        opacity: 0;
        transform: scale(0.8);
        transition: opacity 0.18s ease-out;
      }
      #game-cursor.is-charging .glow { opacity: 1; animation: cursor-glow 0.55s ease-in-out infinite; }

      #game-cursor img {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 32px 30px; /* palm = hotspot */
        will-change: transform;
        transition: transform 0.1s ease-out;
        -webkit-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      @keyframes cursor-glow {
        0%, 100% { transform: scale(0.85); opacity: 0.45; }
        50%      { transform: scale(1.2);  opacity: 0.95; }
      }

      /* touch devices keep the plain browser cursor */
      body.touch #game { cursor: default; }
      body.touch #game-cursor { display: none !important; }

      @media (prefers-reduced-motion: reduce) {
        #game-cursor .glow { animation: none !important; }
        #game-cursor img { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Game"></canvas>
      <div id="game-cursor" aria-hidden="true">
        <span class="glow"></span>
        <img id="game-cursor-img" src="./assets/cursor-hand.svg" alt="" draggable="false" />
      </div>
      <div id="hud"></div>
      <div id="screens"></div>
      <div id="debug"></div>
      <div id="rotate" role="dialog" aria-label="Rotate your phone">
        <div class="rotate-phone"></div>
        <div class="rotate-title">ROTATE YOUR PHONE</div>
        <div class="rotate-sub">This room is wider than it is tall.</div>
        <button id="rotate-dismiss" type="button" class="btn">PLAY UPRIGHT ANYWAY</button>
      </div>
    </div>
    <script>
      (function () {
        // Only for precise pointers; touch devices keep their own cursor.
        if (window.matchMedia && !window.matchMedia('(pointer: fine)').matches) return;

        var cursor = document.getElementById('game-cursor');
        var img = document.getElementById('game-cursor-img');
        if (!cursor || !img) return;

        var SRC = {
          open: './assets/cursor-hand.svg',
          grab: './assets/cursor-hand-grab.svg',
          throw: './assets/cursor-hand-throw.svg'
        };

        // Hotspot inside the 64x64 art (palm). Kept in sync with CSS transform-origin.
        var HOT_X = 32, HOT_Y = 30;

        var tx = 0, ty = 0;        // mouse target
        var x = 0, y = 0;          // smoothed position
        var lastX = 0;
        var tilt = 0, tiltTarget = 0;
        var scale = 1, scaleTarget = 1;
        var holding = false, holdStart = 0;
        var state = 'open';
        var shown = false;
        var overUi = false;
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function setState(next) {
          if (state === next) return;
          state = next;
          img.src = SRC[next];
        }
        function show() {
          if (!inGame() || shown) return;
          shown = true;
          cursor.classList.add('is-visible');
        }
        function hide() {
          if (!shown) return;
          shown = false;
          cursor.classList.remove('is-visible');
        }
        function onUi(target) {
          return !!(target && target.closest &&
            target.closest('button, a, input, select, textarea, label, summary, .btn, .hud-pause, .mk-gear'));
        }
        // The hand belongs to gameplay: menus keep their native pointer so the
        // two cursors never show at once.
        function inGame() {
          return document.body.classList.contains('playing');
        }

        document.addEventListener('mousemove', function (e) {
          tx = e.clientX;
          ty = e.clientY;
          overUi = onUi(e.target);
          if (!shown) { x = tx; y = ty; }
          if (overUi || !inGame()) hide(); else show();
        }, { passive: true, capture: true });

        document.addEventListener('pointerdown', function (e) {
          if (onUi(e.target)) return;
          holding = true;
          holdStart = performance.now();
          setState('grab');
          scaleTarget = 0.9;
          cursor.classList.remove('is-charging');
          window.setTimeout(function () { if (holding) scaleTarget = 1; }, 120);
        }, true);

        document.addEventListener('pointerup', function () {
          if (!holding) return;
          holding = false;
          var held = (performance.now() - holdStart) / 1000;
          cursor.classList.remove('is-charging');
          setState('throw');
          scaleTarget = 1.12;
          window.setTimeout(function () {
            setState('open');
            scaleTarget = 1;
          }, held > 0.25 ? 260 : 175);
        }, true);

        document.addEventListener('mouseleave', hide);
        window.addEventListener('blur', hide);

        function frame(now) {
          var t = now / 1000;

          // eased follow
          var ease = reduce ? 1 : 0.34;
          x += (tx - x) * ease;
          y += (ty - y) * ease;

          // lean into horizontal movement
          var vx = tx - lastX;
          lastX = tx;
          var lean = Math.max(-12, Math.min(12, vx * 0.5));
          tiltTarget += (lean - tiltTarget) * 0.14;
          tilt = tiltTarget;

          // scale: spring back, idle breath, charge pulse
          scale += (scaleTarget - scale) * 0.28;
          var s = scale;
          if (!reduce) {
            if (holding) {
              var dt = (now - holdStart) / 1000;
              s *= 1 + Math.sin(dt * 13) * 0.035;
              if (dt > 0.16) cursor.classList.add('is-charging');
            } else {
              s *= 1 + Math.sin(t * 2.2) * 0.012;
            }
          }

          // drop the hand as soon as play stops (pause, menu, results)
          if (!inGame()) {
            if (holding) {
              holding = false;
              cursor.classList.remove('is-charging');
              setState('open');
              scaleTarget = 1;
            }
            if (shown) hide();
          }

          cursor.style.transform =
            'translate3d(' + (x - HOT_X) + 'px,' + (y - HOT_Y) + 'px,0)';
          img.style.transform =
            'rotate(' + tilt.toFixed(2) + 'deg) scale(' + s.toFixed(3) + ')';

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
