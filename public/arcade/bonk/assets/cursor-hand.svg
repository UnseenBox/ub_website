<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <defs>
    <filter id="hand-rough" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <!-- torn paper backing -->
  <path d="M4 46 Q 6 4 20 4 Q 34 4 38 14 Q 42 36 30 38 Q 22 40 14 36 Q 6 30 4 46 Z"
        fill="#fffdf6" stroke="#1a142d" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- wrist cuff -->
  <path d="M18 42 Q 16 44 20 46 Q 24 48 28 46 Q 32 44 30 42 Z" fill="#e5383b" stroke="#1a142d" stroke-width="1.6"/>
  <!-- palm -->
  <path d="M16 32 Q 14 22 20 14 Q 24 8 30 10 Q 34 16 36 24 Q 34 32 28 36 Q 22 38 16 32 Z"
        fill="#f5e6d4" stroke="#8a6d3b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- index finger -->
  <path d="M22 12 Q 24 2 30 6 Q 34 10 32 18 Q 28 24 24 20 Q 22 16 22 12 Z"
        fill="#f5e6d4" stroke="#8a6d3b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- middle finger -->
  <path d="M26 14 Q 28 4 34 8 Q 38 12 36 20 Q 32 26 28 22 Q 26 18 26 14 Z"
        fill="#f5e6d4" stroke="#8a6d3b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- ring finger -->
  <path d="M30 18 Q 32 8 38 12 Q 40 16 38 24 Q 34 30 30 26 Q 28 22 30 18 Z"
        fill="#f5e6d4" stroke="#8a6d3b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- pinky -->
  <path d="M34 22 Q 36 14 40 18 Q 42 22 38 28 Q 34 30 32 26 Q 30 24 34 22 Z"
        fill="#f5e6d4" stroke="#8a6d3b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- thumb -->
  <path d="M14 30 Q 10 28 10 22 Q 12 16 18 16 Q 22 18 20 24 Q 16 30 14 30 Z"
        fill="#f5e6d4" stroke="#8a6d3b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- fingertip accents -->
  <circle cx="31" cy="7" r="2.2" fill="#ffd23f"/>
  <circle cx="35" cy="11" r="2" fill="#ffd23f"/>
  <circle cx="39" cy="17" r="1.8" fill="#ffd23f"/>
  <circle cx="37" cy="23" r="1.6" fill="#ffd23f"/>
  <!-- nails -->
  <path d="M30 6 Q 32 4 34 6 Q 32 8 30 6 Z" fill="#ffe08a"/>
  <path d="M34 10 Q 36 8 38 10 Q 36 12 34 10 Z" fill="#ffe08a"/>
</svg>
