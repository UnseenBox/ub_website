<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="paper-rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9"/>
    </filter>
    <filter id="paper-drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2" dy="3" stdDeviation="0.35" flood-color="#100c1e" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#paper-drop)">
    <g filter="url(#paper-rough)" fill="#f7fbee" stroke="#2f3a12" stroke-width="2.4"
       stroke-linejoin="round" stroke-linecap="round">
      <!-- fingers -->
      <rect x="24" y="10" width="7"  height="23" rx="3.5"/>
      <rect x="32" y="7"  width="7"  height="26" rx="3.5"/>
      <rect x="40" y="11" width="7"  height="22" rx="3.5"/>
      <rect x="47" y="17" width="6"  height="18" rx="3"/>
      <!-- palm -->
      <path d="M21 30 Q 17 36 19 44 Q 22 52 33 52 Q 45 52 48 44 Q 50 35 45 30 Q 39 27 34 30 Q 27 27 21 30 Z"/>
      <!-- thumb -->
      <path d="M21 34 Q 12 33 11 26 Q 12 20 20 24 Q 24 28 25 35 Z"/>
      <!-- cuff -->
      <path d="M21 50 Q 22 58 33 58 Q 45 57 45 50 Q 33 55 21 50 Z" fill="#7da70f"/>
    </g>

    <!-- finger seams -->
    <g fill="none" stroke="#a8bf6a" stroke-width="1.3" stroke-linecap="round" opacity="0.75">
      <path d="M31 22 Q 31 30 31 36"/>
      <path d="M38.5 20 Q 38.5 29 38.5 36"/>
      <path d="M45.5 23 Q 45.5 31 45.5 37"/>
    </g>

    <!-- yellow accents -->
    <g fill="#e8c34a" stroke="#2f3a12" stroke-width="1">
      <circle cx="27.5" cy="10.5" r="2"/>
      <circle cx="35.5" cy="7.5"  r="1.9"/>
      <circle cx="43.5" cy="11.5" r="1.6"/>
      <circle cx="49.5" cy="17.5" r="1.4"/>
    </g>
    <!-- knuckle highlights -->
    <g fill="#ffffff" opacity="0.55">
      <ellipse cx="27" cy="15" rx="2.4" ry="3.4"/>
      <ellipse cx="35" cy="12" rx="2.4" ry="3.8"/>
      <ellipse cx="43" cy="16" rx="2.2" ry="3.2"/>
    </g>
  </g>
</svg>
