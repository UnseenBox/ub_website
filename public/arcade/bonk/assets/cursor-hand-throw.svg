<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="throw-rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.9"/>
    </filter>
    <filter id="throw-drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2" dy="3" stdDeviation="0.35" flood-color="#100c1e" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- motion lines behind the hand -->
  <g fill="none" stroke="#e8c34a" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <path d="M6 34 Q 14 32 20 34"/>
    <path d="M4 41 Q 13 39 19 41"/>
    <path d="M8 48 Q 15 46 20 48"/>
  </g>

  <g filter="url(#throw-drop)">
    <g filter="url(#throw-rough)" fill="#f7fbee" stroke="#2f3a12" stroke-width="2.4"
       stroke-linejoin="round" stroke-linecap="round">
      <!-- fingers spread wide (release) -->
      <rect x="26" y="9"  width="7" height="24" rx="3.5" transform="rotate(-10 29.5 21)"/>
      <rect x="34" y="6"  width="7" height="27" rx="3.5"/>
      <rect x="42" y="10" width="7" height="23" rx="3.5" transform="rotate(10 45.5 21)"/>
      <rect x="49" y="17" width="6" height="18" rx="3"  transform="rotate(16 52 26)"/>
      <!-- palm -->
      <path d="M23 30 Q 19 36 21 44 Q 24 52 35 52 Q 47 52 50 44 Q 52 35 47 30 Q 41 27 36 30 Q 29 27 23 30 Z"/>
      <!-- thumb snapped open -->
      <path d="M23 34 Q 13 32 11 25 Q 12 19 21 23 Q 26 27 27 35 Z"/>
      <!-- cuff -->
      <path d="M23 50 Q 24 58 35 58 Q 47 57 47 50 Q 35 55 23 50 Z" fill="#7da70f"/>
    </g>

    <!-- release spark -->
    <g fill="#e8c34a" stroke="#2f3a12" stroke-width="1">
      <circle cx="14" cy="18" r="2.2"/>
      <circle cx="20" cy="10" r="1.6"/>
      <circle cx="54" cy="14" r="1.9"/>
    </g>
  </g>
</svg>
