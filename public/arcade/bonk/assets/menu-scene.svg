<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ecd8"/>
      <stop offset="1" stop-color="#e6d7b8"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08f61"/>
      <stop offset="1" stop-color="#9d6f47"/>
    </linearGradient>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6f9e"/>
      <stop offset="0.55" stop-color="#8f87ab"/>
      <stop offset="1" stop-color="#e0a878"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8f6a"/>
      <stop offset="1" stop-color="#41684d"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffcf7a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="64" height="10" patternUnits="userSpaceOnUse">
      <rect width="64" height="10" fill="#f6ecd8"/>
      <rect width="26" height="10" fill="#efe1c4"/>
    </pattern>
    <style>
      .lamp-glow { animation: glow 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .lamp-glow-2 { animation: glow 5.5s ease-in-out infinite .8s; transform-box: fill-box; transform-origin: center; }
      @keyframes glow {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { .lamp-glow, .lamp-glow-2 { animation: none; } }
    </style>
  </defs>

  <!-- ===== wall ===== -->
  <rect width="1600" height="900" fill="url(#stripes)"/>
  <rect width="1600" height="900" fill="url(#wallGrad)" opacity="0.55"/>

  <!-- warm wash from the lamp -->
  <ellipse class="lamp-glow" cx="1272" cy="520" rx="420" ry="330" fill="url(#lampGlow)"/>

  <!-- ===== window ===== -->
  <g>
    <rect x="1046" y="96" width="368" height="356" rx="10" fill="#d9c7a2"/>
    <rect x="1062" y="112" width="336" height="324" rx="6" fill="url(#duskSky)"/>
    <!-- moon -->
    <circle cx="1330" cy="176" r="30" fill="#fdf3d6" opacity="0.92"/>
    <circle cx="1342" cy="168" r="28" fill="#8f87ab" opacity="0.55"/>
    <!-- horizon glow -->
    <ellipse cx="1230" cy="420" rx="210" ry="70" fill="url(#sunGlow)"/>
    <!-- mullions -->
    <rect x="1224" y="112" width="12" height="324" fill="#d9c7a2"/>
    <rect x="1062" y="266" width="336" height="12" fill="#d9c7a2"/>
    <!-- sill -->
    <rect x="1030" y="446" width="400" height="20" rx="6" fill="#cbb894"/>
    <!-- curtains -->
    <path d="M1030 92 q 46 40 30 120 q -14 78 8 134 q -6 116 -34 150 L1030 496 Z" fill="#c4704f" opacity="0.9"/>
    <path d="M1430 92 q -46 40 -30 120 q 14 78 -8 134 q 6 116 34 150 L1430 496 Z" fill="#c4704f" opacity="0.9"/>
  </g>

  <!-- ===== framed pictures ===== -->
  <g>
    <rect x="196" y="150" width="164" height="204" rx="6" fill="#cbb894"/>
    <rect x="210" y="164" width="136" height="176" rx="3" fill="#f2e7cd"/>
    <path d="M210 300 l 46 -64 l 34 40 l 26 -30 l 30 54 l 0 40 l -136 0 Z" fill="#8fae7a"/>
    <circle cx="312" cy="210" r="16" fill="#e0a878"/>
  </g>
  <g>
    <rect x="392" y="176" width="124" height="158" rx="6" fill="#cbb894"/>
    <rect x="404" y="188" width="100" height="134" rx="3" fill="#f2e7cd"/>
    <circle cx="454" cy="238" r="34" fill="#9db9a6"/>
    <circle cx="454" cy="238" r="16" fill="#e8d7b4"/>
    <rect x="424" y="286" width="60" height="8" rx="4" fill="#c9b48c"/>
  </g>

  <!-- ===== baseboard + floor ===== -->
  <rect x="0" y="686" width="1600" height="22" fill="#d3bd96"/>
  <rect x="0" y="708" width="1600" height="192" fill="url(#floorGrad)"/>
  <g stroke="#8a6039" stroke-width="3" opacity="0.35">
    <path d="M0 748 H1600"/>
    <path d="M0 800 H1600"/>
    <path d="M0 856 H1600"/>
    <path d="M180 708 V748 M540 708 V748 M900 708 V748 M1260 708 V748"/>
    <path d="M340 748 V800 M700 748 V800 M1060 748 V800 M1420 748 V800"/>
    <path d="M180 800 V856 M540 800 V856 M900 800 V856 M1260 800 V856"/>
  </g>

  <!-- ===== rug ===== -->
  <ellipse cx="800" cy="806" rx="452" ry="78" fill="#d9c39a"/>
  <ellipse cx="800" cy="806" rx="392" ry="60" fill="none" stroke="#b8946a" stroke-width="6" opacity="0.7"/>
  <ellipse cx="800" cy="806" rx="300" ry="44" fill="#c9ad83" opacity="0.55"/>

  <!-- ===== sofa ===== -->
  <g>
    <!-- back -->
    <rect x="140" y="486" width="520" height="126" rx="18" fill="url(#sofaGrad)"/>
    <!-- cushions -->
    <rect x="176" y="500" width="150" height="96" rx="14" fill="#6f9c7a"/>
    <rect x="336" y="500" width="150" height="96" rx="14" fill="#6f9c7a"/>
    <rect x="496" y="500" width="132" height="96" rx="14" fill="#6f9c7a"/>
    <!-- seat -->
    <rect x="126" y="596" width="548" height="86" rx="18" fill="#4b7758"/>
    <!-- arms -->
    <rect x="112" y="556" width="52" height="126" rx="20" fill="#5f8f6a"/>
    <rect x="636" y="556" width="52" height="126" rx="20" fill="#5f8f6a"/>
    <!-- legs -->
    <rect x="166" y="678" width="18" height="26" rx="5" fill="#7a5533"/>
    <rect x="618" y="678" width="18" height="26" rx="5" fill="#7a5533"/>
    <!-- throw pillow -->
    <rect x="228" y="522" width="74" height="70" rx="14" fill="#e0a878" transform="rotate(-8 265 557)"/>
  </g>

  <!-- ===== floor lamp ===== -->
  <g>
    <rect x="1264" y="430" width="14" height="270" rx="7" fill="#8a6a4a"/>
    <ellipse cx="1271" cy="702" rx="56" ry="14" fill="#7a5533"/>
    <path d="M1214 430 L1328 430 L1306 348 L1236 348 Z" fill="#f2d59a" stroke="#c9a86f" stroke-width="5" stroke-linejoin="round"/>
    <ellipse class="lamp-glow-2" cx="1271" cy="430" rx="120" ry="46" fill="url(#lampGlow)"/>
  </g>

  <!-- ===== plant ===== -->
  <g>
    <path d="M1420 700 l 12 -96 l 76 0 l 12 96 Z" fill="#c4704f"/>
    <rect x="1428" y="596" width="72" height="14" rx="4" fill="#a95c3e"/>
    <g fill="#6f9c4a">
      <ellipse cx="1446" cy="548" rx="20" ry="46" transform="rotate(-24 1446 548)"/>
      <ellipse cx="1478" cy="536" rx="18" ry="52" transform="rotate(10 1478 536)"/>
      <ellipse cx="1506" cy="560" rx="16" ry="40" transform="rotate(28 1506 560)"/>
    </g>
    <g fill="#5f8b3d">
      <ellipse cx="1460" cy="566" rx="14" ry="34" transform="rotate(-8 1460 566)"/>
      <ellipse cx="1494" cy="574" rx="12" ry="30" transform="rotate(20 1494 574)"/>
    </g>
  </g>

  <!-- ===== soft vignette ===== -->
  <rect width="1600" height="900" fill="#3a2a1a" opacity="0.06"/>
</svg>
