<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8efdd"/>
      <stop offset="1" stop-color="#e3d3b2"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c69768"/>
      <stop offset="1" stop-color="#966a43"/>
    </linearGradient>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6496"/>
      <stop offset="0.5" stop-color="#8a83a8"/>
      <stop offset="1" stop-color="#e8b07a"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#639371"/>
      <stop offset="1" stop-color="#3d6449"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffe3b0" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffe3b0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffcf7a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pendantGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6b8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe6b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="72" height="12" patternUnits="userSpaceOnUse">
      <rect width="72" height="12" fill="#f8efdd"/>
      <rect width="30" height="12" fill="#f0e3c8"/>
    </pattern>
    <pattern id="rugPattern" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="#dcc7a0"/>
      <path d="M23 4 L42 23 L23 42 L4 23 Z" fill="none" stroke="#c3a87c" stroke-width="3"/>
      <circle cx="23" cy="23" r="4" fill="#c3a87c"/>
    </pattern>
    <style>
      .flicker { animation: flicker 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .flicker-2 { animation: flicker 6s ease-in-out infinite .9s; transform-box: fill-box; transform-origin: center; }
      .flicker-3 { animation: flicker 8s ease-in-out infinite 1.6s; transform-box: fill-box; transform-origin: center; }
      @keyframes flicker {
        0%, 100% { opacity: 0.85; }
        45%      { opacity: 1; }
        70%      { opacity: 0.92; }
      }
      @media (prefers-reduced-motion: reduce) { .flicker, .flicker-2, .flicker-3 { animation: none; } }
    </style>
  </defs>

  <!-- ===== wall ===== -->
  <rect width="1600" height="900" fill="url(#stripes)"/>
  <rect width="1600" height="900" fill="url(#wallGrad)" opacity="0.6"/>
  <!-- picture rail + cornice -->
  <rect x="0" y="0" width="1600" height="26" fill="#e2d0ab"/>
  <rect x="0" y="26" width="1600" height="9" fill="#cdb891" opacity="0.85"/>
  <rect x="0" y="104" width="1600" height="7" fill="#d8c49e" opacity="0.7"/>

  <!-- warm washes -->
  <ellipse class="flicker" cx="1268" cy="520" rx="440" ry="340" fill="url(#lampGlow)"/>
  <ellipse class="flicker-3" cx="800" cy="150" rx="330" ry="260" fill="url(#pendantGlow)"/>

  <!-- ===== pendant lamp ===== -->
  <g>
    <rect x="797" y="26" width="6" height="86" fill="#8a6a4a"/>
    <path d="M756 152 L844 152 L826 112 L774 112 Z" fill="#e8c9a0" stroke="#b99a74" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="800" cy="152" rx="44" ry="9" fill="#ffe9c4" stroke="#b99a74" stroke-width="3"/>
    <ellipse class="flicker-2" cx="800" cy="160" rx="70" ry="26" fill="url(#pendantGlow)"/>
  </g>

  <!-- ===== window ===== -->
  <g>
    <rect x="1050" y="132" width="372" height="368" rx="8" fill="#d5c19b"/>
    <rect x="1066" y="148" width="340" height="336" rx="4" fill="url(#duskSky)"/>
    <circle cx="1336" cy="212" r="31" fill="#fdf3d6" opacity="0.94"/>
    <circle cx="1349" cy="204" r="29" fill="#8a83a8" opacity="0.6"/>
    <!-- far hills in the window -->
    <path d="M1066 430 q 60 -34 120 -10 q 70 28 120 -8 q 60 -30 100 6 V484 H1066 Z" fill="#6f7a86" opacity="0.55"/>
    <ellipse cx="1236" cy="452" rx="200" ry="56" fill="url(#sunGlow)"/>
    <rect x="1228" y="148" width="13" height="336" fill="#d5c19b"/>
    <rect x="1066" y="304" width="340" height="13" fill="#d5c19b"/>
    <rect x="1034" y="492" width="404" height="20" rx="6" fill="#c8b28c"/>
    <rect x="1034" y="124" width="404" height="11" rx="5" fill="#b99a74"/>
    <!-- curtains -->
    <path d="M1034 126 q 48 42 30 126 q -16 82 8 140 q -6 122 -38 158 L1034 534 Z" fill="#c4704f" opacity="0.92"/>
    <path d="M1438 126 q -48 42 -30 126 q 16 82 -8 140 q 6 122 38 158 L1438 534 Z" fill="#c4704f" opacity="0.92"/>
    <path d="M1040 130 q 30 90 10 190" fill="none" stroke="#a95c3e" stroke-width="4" opacity="0.5"/>
    <path d="M1432 130 q -30 90 -10 190" fill="none" stroke="#a95c3e" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- light beam from window across the room -->
  <path d="M1066 470 L1432 470 L1200 900 L520 900 Z" fill="url(#beamGrad)"/>

  <!-- ===== wall clock ===== -->
  <g>
    <circle cx="700" cy="196" r="46" fill="#f4e8cf" stroke="#8a6a4a" stroke-width="6"/>
    <circle cx="700" cy="196" r="36" fill="none" stroke="#cdb891" stroke-width="2"/>
    <g stroke="#5a4630" stroke-width="4" stroke-linecap="round">
      <path d="M700 168 V176"/><path d="M700 216 V224"/>
      <path d="M672 196 H680"/><path d="M720 196 H728"/>
    </g>
    <path d="M700 196 V172" stroke="#3b2f1e" stroke-width="4" stroke-linecap="round"/>
    <path d="M700 196 L722 208" stroke="#3b2f1e" stroke-width="4" stroke-linecap="round"/>
    <circle cx="700" cy="196" r="4" fill="#c4553f"/>
  </g>

  <!-- ===== framed pictures ===== -->
  <g>
    <rect x="188" y="150" width="168" height="208" rx="5" fill="#c8b28c"/>
    <rect x="202" y="164" width="140" height="180" rx="2" fill="#f6eeda"/>
    <path d="M202 300 l 48 -66 l 34 42 l 28 -32 l 30 56 v 24 h -140 Z" fill="#8fae7a"/>
    <circle cx="310" cy="206" r="16" fill="#e0a878"/>
  </g>
  <g>
    <rect x="392" y="176" width="126" height="160" rx="5" fill="#c8b28c"/>
    <rect x="404" y="188" width="102" height="136" rx="2" fill="#f6eeda"/>
    <circle cx="455" cy="238" r="35" fill="#9db9a6"/>
    <circle cx="455" cy="238" r="17" fill="#eaddc2"/>
    <rect x="424" y="288" width="62" height="7" rx="3" fill="#c9b48c"/>
  </g>

  <!-- ===== bookshelf ===== -->
  <g>
    <rect x="180" y="392" width="290" height="16" rx="4" fill="#a97c50"/>
    <rect x="180" y="560" width="290" height="16" rx="4" fill="#a97c50"/>
    <rect x="180" y="408" width="12" height="152" fill="#b98a5e"/>
    <rect x="458" y="408" width="12" height="152" fill="#b98a5e"/>
    <!-- books, top shelf -->
    <g>
      <rect x="196" y="336" width="20" height="56" rx="2" fill="#c4553f"/>
      <rect x="218" y="344" width="16" height="48" rx="2" fill="#4a7fa8"/>
      <rect x="236" y="330" width="22" height="62" rx="2" fill="#e8c34a"/>
      <rect x="260" y="348" width="14" height="44" rx="2" fill="#029357"/>
      <rect x="276" y="338" width="19" height="54" rx="2" fill="#8a83a8"/>
      <rect x="297" y="346" width="15" height="46" rx="2" fill="#c4704f"/>
      <rect x="314" y="334" width="21" height="58" rx="2" fill="#5f8f6a"/>
      <rect x="337" y="350" width="13" height="42" rx="2" fill="#b98a5e"/>
      <!-- leaning books -->
      <rect x="356" y="348" width="16" height="44" rx="2" fill="#c4553f" transform="rotate(9 364 370)"/>
      <rect x="376" y="344" width="18" height="48" rx="2" fill="#4a7fa8" transform="rotate(12 385 368)"/>
      <!-- small plant on shelf -->
      <path d="M424 392 l -8 -30 h 26 l -8 30 Z" fill="#c4704f"/>
      <g fill="#6f9c4a">
        <ellipse cx="420" cy="352" rx="6" ry="14" transform="rotate(-18 420 352)"/>
        <ellipse cx="431" cy="348" rx="5" ry="15"/>
        <ellipse cx="441" cy="354" rx="6" ry="13" transform="rotate(20 441 354)"/>
      </g>
    </g>
    <!-- books, bottom shelf -->
    <g>
      <rect x="196" y="500" width="24" height="60" rx="2" fill="#4a7fa8"/>
      <rect x="222" y="508" width="17" height="52" rx="2" fill="#e8c34a"/>
      <rect x="241" y="496" width="20" height="64" rx="2" fill="#c4553f"/>
      <rect x="263" y="512" width="15" height="48" rx="2" fill="#5f8f6a"/>
      <!-- stacked flat books -->
      <rect x="290" y="546" width="74" height="14" rx="2" fill="#8a83a8"/>
      <rect x="294" y="534" width="66" height="12" rx="2" fill="#c4704f"/>
      <rect x="298" y="524" width="58" height="10" rx="2" fill="#029357"/>
      <!-- basket -->
      <path d="M382 560 l 8 -44 h 60 l 8 44 Z" fill="#c9a877" stroke="#a97c50" stroke-width="3"/>
      <path d="M390 536 h 60" stroke="#a97c50" stroke-width="3"/>
    </g>
  </g>

  <!-- ===== baseboard + floor ===== -->
  <rect x="0" y="686" width="1600" height="20" fill="#d8c39c"/>
  <rect x="0" y="706" width="1600" height="194" fill="url(#floorGrad)"/>
  <g stroke="#835c37" stroke-width="3" opacity="0.32">
    <path d="M0 748 H1600"/><path d="M0 800 H1600"/><path d="M0 856 H1600"/>
    <path d="M180 706 V748 M560 706 V748 M940 706 V748 M1320 706 V748"/>
    <path d="M360 748 V800 M740 748 V800 M1120 748 V800 M1500 748 V800"/>
    <path d="M180 800 V856 M560 800 V856 M940 800 V856 M1320 800 V856"/>
  </g>
  <g stroke="#7a5533" stroke-width="2" opacity="0.18">
    <path d="M0 770 H1600"/><path d="M0 828 H1600"/><path d="M0 884 H1600"/>
  </g>

  <!-- ===== rug ===== -->
  <ellipse cx="800" cy="812" rx="470" ry="82" fill="url(#rugPattern)" opacity="0.95"/>
  <ellipse cx="800" cy="812" rx="470" ry="82" fill="none" stroke="#b8946a" stroke-width="7"/>
  <ellipse cx="800" cy="812" rx="404" ry="62" fill="none" stroke="#c3a87c" stroke-width="4" opacity="0.75"/>

  <!-- ===== sofa ===== -->
  <g>
    <rect x="140" y="482" width="524" height="130" rx="20" fill="url(#sofaGrad)"/>
    <rect x="176" y="498" width="152" height="98" rx="15" fill="#71a07d"/>
    <rect x="338" y="498" width="152" height="98" rx="15" fill="#71a07d"/>
    <rect x="498" y="498" width="134" height="98" rx="15" fill="#71a07d"/>
    <rect x="126" y="594" width="552" height="88" rx="20" fill="#487456"/>
    <rect x="126" y="594" width="552" height="16" rx="8" fill="#568a66" opacity="0.7"/>
    <rect x="110" y="552" width="54" height="132" rx="22" fill="#639371"/>
    <rect x="640" y="552" width="54" height="132" rx="22" fill="#639371"/>
    <rect x="168" y="678" width="20" height="28" rx="6" fill="#7a5533"/>
    <rect x="616" y="678" width="20" height="28" rx="6" fill="#7a5533"/>
    <rect x="230" y="520" width="76" height="72" rx="14" fill="#e0a878" transform="rotate(-8 268 556)"/>
    <rect x="230" y="520" width="76" height="72" rx="14" fill="none" stroke="#c98a5b" stroke-width="3" transform="rotate(-8 268 556)"/>
    <rect x="520" y="524" width="70" height="66" rx="13" fill="#d9c39a" transform="rotate(6 555 557)"/>
    <!-- folded blanket -->
    <rect x="596" y="576" width="66" height="22" rx="6" fill="#c4553f" opacity="0.9"/>
  </g>

  <!-- ===== side table + mug ===== -->
  <g>
    <rect x="700" y="640" width="104" height="12" rx="4" fill="#a97c50"/>
    <rect x="716" y="652" width="12" height="52" fill="#b98a5e"/>
    <rect x="776" y="652" width="12" height="52" fill="#b98a5e"/>
    <ellipse cx="752" cy="640" rx="14" ry="4" fill="#efe0c2"/>
    <path d="M740 618 h 24 v 20 a 12 12 0 0 1 -24 0 Z" fill="#efe0c2" stroke="#c8b28c" stroke-width="3"/>
    <path d="M764 624 q 12 4 0 12" fill="none" stroke="#c8b28c" stroke-width="3"/>
    <ellipse class="flicker" cx="752" cy="606" rx="18" ry="8" fill="#fff4d8" opacity="0.45"/>
  </g>

  <!-- ===== floor lamp ===== -->
  <g>
    <rect x="1262" y="452" width="14" height="250" rx="7" fill="#8a6a4a"/>
    <ellipse cx="1269" cy="702" rx="58" ry="15" fill="#7a5533"/>
    <path d="M1212 452 L1326 452 L1304 364 L1234 364 Z" fill="#f4d9a2" stroke="#c9a86f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M1222 444 h 94" stroke="#e8c9a0" stroke-width="4" opacity="0.8"/>
    <ellipse class="flicker-2" cx="1269" cy="452" rx="126" ry="48" fill="url(#lampGlow)"/>
  </g>

  <!-- ===== plant ===== -->
  <g>
    <path d="M1414 700 l 14 -100 h 80 l 14 100 Z" fill="#c4704f"/>
    <rect x="1422" y="592" width="78" height="15" rx="4" fill="#a95c3e"/>
    <g fill="#6f9c4a">
      <ellipse cx="1440" cy="540" rx="21" ry="48" transform="rotate(-26 1440 540)"/>
      <ellipse cx="1476" cy="526" rx="19" ry="54" transform="rotate(8 1476 526)"/>
      <ellipse cx="1508" cy="552" rx="17" ry="42" transform="rotate(30 1508 552)"/>
    </g>
    <g fill="#5f8b3d">
      <ellipse cx="1456" cy="562" rx="15" ry="36" transform="rotate(-8 1456 562)"/>
      <ellipse cx="1494" cy="570" rx="13" ry="32" transform="rotate(22 1494 570)"/>
    </g>
  </g>

  <!-- ===== dust motes in the light ===== -->
  <g fill="#fff3d0" opacity="0.5">
    <circle cx="900" cy="520" r="3"/><circle cx="980" cy="600" r="2.4"/>
    <circle cx="1050" cy="540" r="2"/><circle cx="860" cy="640" r="2.6"/>
    <circle cx="1140" cy="660" r="2.2"/><circle cx="760" cy="700" r="2"/>
  </g>

  <!-- ===== vignette ===== -->
  <rect width="1600" height="900" fill="#3a2a1a" opacity="0.05"/>
</svg>
