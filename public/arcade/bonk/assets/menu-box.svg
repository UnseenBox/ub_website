<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="160" height="170">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c195"/>
      <stop offset="1" stop-color="#c8a06a"/>
    </linearGradient>
  </defs>

  <style>
    .bob  { transform-box: fill-box; transform-origin: center bottom; animation: bob 3.4s ease-in-out infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s ease-in-out infinite; }
    .arm-l { transform-box: fill-box; transform-origin: right center; animation: wave 2.8s ease-in-out infinite; }
    .arm-r { transform-box: fill-box; transform-origin: left center; animation: wave 2.8s ease-in-out infinite .35s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-9px) rotate(1.5deg); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(0.08); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-16deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bob, .eyes, .arm-l, .arm-r { animation: none !important; }
    }
  </style>

  <g class="bob">
    <!-- legs -->
    <g stroke="#2f3a12" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M57 120 v 24"/>
      <path d="M101 120 v 24"/>
    </g>
    <g fill="#2f3a12">
      <ellipse cx="57" cy="147" rx="13" ry="8"/>
      <ellipse cx="101" cy="147" rx="13" ry="8"/>
    </g>

    <!-- arms -->
    <g stroke="#2f3a12" stroke-width="7" stroke-linecap="round" fill="none">
      <path class="arm-l" d="M35 74 q -19 8 -19 26"/>
      <path class="arm-r" d="M123 74 q 19 8 19 26"/>
    </g>

    <!-- open flaps -->
    <path d="M43 18 L19 -6 L41 -10 L61 12 Z" fill="#d8b483" stroke="#2f3a12" stroke-width="6" stroke-linejoin="round"/>
    <path d="M115 18 L139 -6 L117 -10 L97 12 Z" fill="#d8b483" stroke="#2f3a12" stroke-width="6" stroke-linejoin="round"/>

    <!-- body -->
    <rect x="35" y="12" width="88" height="112" rx="12" fill="url(#boxGrad)" stroke="#2f3a12" stroke-width="7"/>

    <!-- tape -->
    <rect x="69" y="16" width="20" height="104" fill="#eadfc4" stroke="#2f3a12" stroke-width="4" opacity="0.85"/>

    <!-- eyes -->
    <g class="eyes">
      <ellipse cx="61" cy="56" rx="16" ry="17" fill="#ffffff" stroke="#2f3a12" stroke-width="5"/>
      <ellipse cx="95" cy="56" rx="16" ry="17" fill="#ffffff" stroke="#2f3a12" stroke-width="5"/>
      <circle cx="65" cy="60" r="7" fill="#2f3a12"/>
      <circle cx="99" cy="60" r="7" fill="#2f3a12"/>
      <circle cx="68" cy="57" r="2.6" fill="#ffffff"/>
      <circle cx="102" cy="57" r="2.6" fill="#ffffff"/>
    </g>

    <!-- mouth -->
    <path d="M67 86 q 14 12 28 0" fill="none" stroke="#2f3a12" stroke-width="5" stroke-linecap="round"/>

    <!-- blush -->
    <ellipse cx="43" cy="76" rx="7" ry="5" fill="#e08a72" opacity="0.55"/>
    <ellipse cx="113" cy="76" rx="7" ry="5" fill="#e08a72" opacity="0.55"/>
  </g>
</svg>
