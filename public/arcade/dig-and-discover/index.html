    <script>
      (function () {
        var tips = [
          'Dig deeper to find rarer rocks.',
          'Cut rocks open at the workshop to see what is inside.',
          'The bank wants its payment by the end of the month.',
          'A better shovel digs bigger holes.',
          'Finish the daily goals to earn extra cash.',
          'Every find you cut goes into your album.',
        ];
        var el = document.getElementById('ld-tip');
        if (el) el.textContent = 'Tip: ' + tips[Math.floor(Math.random() * tips.length)];
        // Called by the game once the first scene is up.
        window.__hideLoading = function () {
          var l = document.getElementById('loading');
          if (!l) return;
          l.classList.add('done');
          setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 600);
        };
      })();
    </script>
