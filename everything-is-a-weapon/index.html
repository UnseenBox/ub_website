<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#143a33" />
    <meta name="description" content="The garden gnomes have broken into your house. Grab the frying pan. A physics brawler where everything in your home is a weapon: throw the furniture, wet the floor, flip the breaker. My house, my rules." />
    <title>My House, My Rules</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23143a33'/%3E%3Cpath d='M16 5 4 15h3v11h7v-7h4v7h7V15h3z' fill='%23ffb02e'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Game"></canvas>
      <div id="hud"></div>
      <div id="screens"></div>
      <div id="menu-credits-panel" hidden>
        <div class="mcp-card" role="dialog" aria-modal="true" aria-label="Credits">
          <h2>CREDITS</h2>
          <p>My House, My Rules &mdash; everything is a weapon</p>
          <p>A physics sandbox brawler by UnseenBox</p>
          <p>Design, code &amp; art: the UnseenBox team</p>
          <button id="menu-credits-close" type="button" class="mcp-close">CLOSE</button>
        </div>
      </div>
      <div id="debug"></div>
      <div id="rotate" role="dialog" aria-label="Rotate your phone">
        <div class="rotate-phone"></div>
        <div class="rotate-title">ROTATE YOUR PHONE</div>
        <div class="rotate-sub">This room is wider than it is tall.</div>
        <button id="rotate-dismiss" type="button" class="btn">PLAY UPRIGHT ANYWAY</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
