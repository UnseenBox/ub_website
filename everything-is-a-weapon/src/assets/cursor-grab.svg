<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Closed fist, drawn 4px higher than the open hand so the graphic does not
       jump when the cursor swaps. Pointer is the first knuckle. -->
  <g fill="#221b36" stroke="#221b36" stroke-width="2.6" stroke-linejoin="round">
    <rect x="6.5" y="8.5" width="17.5" height="15.5" rx="6"/>
    <rect x="7" y="3" width="6.5" height="10" rx="3.25"/>
    <rect x="13" y="2.2" width="6.5" height="10" rx="3.25"/>
    <rect x="18.8" y="3.6" width="6.2" height="10" rx="3.1"/>
    <rect x="2" y="14" width="11.5" height="6.8" rx="3.4" transform="rotate(22 7.75 17.4)"/>
  </g>
  <g fill="#ffffff">
    <rect x="6.5" y="8.5" width="17.5" height="15.5" rx="6"/>
    <rect x="7" y="3" width="6.5" height="10" rx="3.25"/>
    <rect x="13" y="2.2" width="6.5" height="10" rx="3.25"/>
    <rect x="18.8" y="3.6" width="6.2" height="10" rx="3.1"/>
    <rect x="2" y="14" width="11.5" height="6.8" rx="3.4" transform="rotate(22 7.75 17.4)"/>
  </g>
</svg>
