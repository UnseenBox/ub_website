<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>pet focus</title>
<style>
  html, body { margin: 0; background: #1b1730; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="sheet" width="1200" height="560"></canvas>
<script type="module">
  import { Cat } from '/src/entities/Cat.ts';
  import { Dog, Parrot, Hamster } from '/src/entities/Pets.ts';
  import { drawPet } from '/src/rendering/PetArt.ts';

  const canvas = document.getElementById('sheet');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#241d3d';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const dog = new Dog(0, 0);
  dog.facing = 1;
  dog.sitting = true;
  dog.frenzy = 1;
  const cat = new Cat(0, 0);
  cat.facing = 1;
  cat.sitting = true;
  const parrot = new Parrot(0, 0);
  parrot.facing = 1;
  parrot.flying = 0;
  const ham = new Hamster(0, 0);
  ham.facing = 1;
  ham.frenzy = 1;
  ham.size = 2;
  const pets = [['WAFFLE', dog], ['BISCUIT', cat], ['CAPTAIN', parrot], ['NUGGET', ham]];
  pets.forEach(([name, pet], i) => {
    const cx = 150 + i * 300;
    const base = 430;
    ctx.save();
    ctx.translate(cx, base);
    ctx.scale(5, 5);
    drawPet(ctx, pet, 0, 0, 0, 1.2);
    ctx.restore();
    ctx.fillStyle = '#ffd23f';
    ctx.font = '700 18px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(name, cx, 510);
  });
  document.title = 'pet-focus-ready';
</script>
</body>
</html>
