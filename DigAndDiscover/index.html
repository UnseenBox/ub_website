<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7fcfff" />
    <title>Dig &amp; Discover</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #7fcfff; }
      body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; touch-action: none; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 700 22px "Trebuchet MS", sans-serif; color: #5a3a22; }
    </style>
  </head>
  <body>
    <div id="loading">Loading...</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
